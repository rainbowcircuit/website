<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Rainbow Circuit | Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="page">
        <main class="layout layout--stacked">
            <header class="site-header">
                <rc-home size="80"></rc-home>
                <rc-menu size="40" hide-text></rc-menu>
            </header>

            <div class="layout">
                <section class="intro">
                    <div>
                        <p>Questions? Requests? Rage? Shoot us an email at hey@rainbowcircuit.co</p>
                        <h2>Frequently Asked Questions</h2>
                        <h3>Installing a Max for Live Device</h3>
                    </div>
                </section>

                <section class="feature">
                    <canvas id="support" width="300" height="600"></canvas>
                </section>
            </div>

        </main>

        <footer>
            <p>&copy;2026 Rainbow Circuit</p>
            <div class="links">
                <a href="apple.com">Instagram</a>
                <a href="apple.com">Youtube</a>
                <a href="apple.com">Email</a>
            </div>
        </footer>
    </div>

    <script type="module" src="./shared/navigation.js"></script>
</body> 

<script type="module">
    await document.fonts.load("35px Outfit")

    const canvas = document.getElementById("support")
    const ctx = canvas.getContext("2d")
    const w = canvas.width, h = canvas.height;

    const dpr = Math.max(window.devicePixelRatio || 1, 2)
    canvas.style.width = `${w}px`
    canvas.style.height = `${h}px`
    canvas.width = w * dpr
    canvas.height = h * dpr
    ctx.scale(dpr, dpr)



    class Vector {
        constructor(x, y) {
            this.x = x;
            this.y = y;
        }

        add(v) {
            this.x = this.x + v.x
            this.y = this.y + v.y
        }

        mult(d) {
            this.x = this.x * d
            this.y = this.y * d
        }
    }

    class Plane {
        constructor() {
            this.pos = new Vector(w / 2, h / 2);
            this.vel = new Vector(0, 0);
            this.angle = Math.PI / 4 
        }

        reset(x, y) {
            this.pos.x = x
            this.pos.y = y
            this.vel.x = (Math.random() - 0.5) * 2 * 8
            this.vel.y = (Math.random() - 0.5) * 2 * 10

        }

        update() {
            this.pos.add(this.vel)
            if (clickPos === 'up'){
                this.vel.y += Math.random() * 0.2
            } else if (clickPos === 'down') {
                this.vel.y -= Math.random() * 0.2
            }

            if (Math.hypot(this.vel.x, this.vel.y) > 0.01) {
                this.angle = Math.atan2(this.vel.y, this.vel.x) + Math.PI / 2
            }
        }

        draw(ctx) {
            if (clickPos != 'none'){
                ctx.strokeStyle = '#2d2d2d'
                const cx = this.pos.x, cy = this.pos.y
                const size = 35;

                ctx.save()
                ctx.translate(cx, cy)
                ctx.rotate(this.angle)

                ctx.beginPath()
                ctx.moveTo(0, -size * 0.45)
                ctx.lineTo(-size * 0.35, size * 0.35)
                ctx.lineTo(size * 0.35, size * 0.35)
                ctx.closePath()
                ctx.fillStyle = 'white'
                ctx.fill()


                ctx.moveTo(0, -size * 0.45)
                ctx.lineTo(0, size * 0.45)
                ctx.lineTo(size * 0.1, size * 0.35)

                ctx.lineWidth = 1.5
                ctx.fill()
                ctx.stroke()
                ctx.restore()
            }
        }
    }

    let clickPos = 'none';
    const planes = []
    for(let i = 0; i < 24; i++){
        planes.push(new Plane())
    }

    const draw = () => {
        ctx.clearRect(0, 0, w, h)
        for (const plane of planes) {
            plane.draw(ctx)
            plane.update()
        }

        ctx.font = "35px Outfit, sans-serif"
        ctx.fillStyle = 'black'
        ctx.textAlign = 'center'
        ctx.textBaseline = 'middle'
        ctx.fillText("Support", w / 2, h / 2)
    }

    canvas.addEventListener('click', (e) => {
        const x = e.offsetX, y = e.offsetY
        
        clickPos = y > h / 2 ? 'down' : 'up'
        for(const plane of planes){
            plane.reset(x, y)
        }
    })

    const tick = () => {
        draw();
        requestAnimationFrame(tick)
    }
    tick()

</script>
</html>
